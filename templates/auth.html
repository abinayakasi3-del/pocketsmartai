{% extends "base.html" %}{% block body %}
<div class="card"><h1 style="font-size:32px">{{ 'Create account' if mode=='register' else 'Log in' }}</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post"><label for="u">Username</label><input id="u" name="username" required autocomplete="username">
<label for="p">Password</label><input id="p" name="password" type="password" required autocomplete="{{ 'new-password' if mode=='register' else 'current-password' }}">
<button>{{ 'Create account' if mode=='register' else 'Log in' }}</button></form>
<p class="muted">{% if mode=='register' %}Have an account? <a href="/login">Log in</a>{% else %}New here? <a href="/register">Create an account</a>{% endif %}</p></div>
{% endblock %}
